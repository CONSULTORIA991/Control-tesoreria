<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Control de Tesorería</title>
<style>
:root{--bg:#f2f5f3;--surface:#fff;--ink:#17201c;--muted:#5a6962;--line:#d6dfda;--accent:#0e6a53;--bad:#b0281f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1412;--surface:#171f1b;--ink:#e4ebe7;--muted:#97a69f;--line:#2a3530;--accent:#52c29d;--bad:#f0867e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px 16px}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.3rem}p{margin:0;color:var(--muted);font-size:.9rem}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 .95rem "Segoe UI",system-ui,sans-serif;border:0;border-radius:8px;background:var(--accent);color:#fff;padding:11px;cursor:pointer}
button:disabled{opacity:.6}
#m{color:var(--bad);min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Control de Tesorería</h1>
  <p>Acceso restringido. Entra con tu usuario y contraseña.</p>
  <label for="u">Usuario<input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  <label for="p">Contraseña<input id="p" type="password" autocomplete="current-password" required></label>
  <button id="b" type="submit">Entrar</button>
  <p id="m" role="alert"></p>
</form>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function sha(t){var h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();
  var u=document.getElementById("u").value.trim().toLowerCase(),p=document.getElementById("p").value,m=document.getElementById("m"),btn=document.getElementById("b");
  btn.disabled=true;m.style.color="inherit";m.textContent="Verificando…";
  try{
    var hu=await sha(DATOS.sal+"|"+u),ent=DATOS.usuarios[hu],remoto=null;
    if(DATOS.owner){try{var rr=await fetch("https://api.github.com/repos/"+DATOS.owner+"/"+DATOS.repo+"/contents/a/acceso.json?ref=datos",{headers:{"Accept":"application/vnd.github.raw"},cache:"no-store"});if(rr.ok)remoto=await rr.json()}catch(_){}}
    if(remoto){if(remoto.usuarios){if(Object.prototype.hasOwnProperty.call(remoto.usuarios,hu))ent=remoto.usuarios[hu]}}
    if(!ent)throw 0;
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
    var kw=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ent.s),iterations:DATOS.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var kraw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ent.i)},kw,b64(ent.k));
    var k=await crypto.subtle.importKey("raw",kraw,"AES-GCM",false,["decrypt"]);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATOS.iv)},k,b64(DATOS.ct)));
    try{sessionStorage.setItem("tes-cred",JSON.stringify({usuario:u,k:btoa(String.fromCharCode.apply(null,new Uint8Array(kraw))),sal:DATOS.sal,it:DATOS.it,e:ent}))}catch(_){}
    document.open();document.write(html);document.close();
  }catch(err){m.style.color="";m.textContent="Usuario o contraseña incorrectos.";btn.disabled=false}
});
