<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Conciliación</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
#tes-login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#eef1f9;padding:24px 16px;font:15px/1.5 "Public Sans","Segoe UI",system-ui,sans-serif;color:#141a2e}
#tes-login form{width:min(400px,100%);background:#fff;border:1px solid #dfe3ef;border-radius:12px;padding:26px;display:flex;flex-direction:column;gap:12px}
#tes-login h1{margin:0;font-size:1.3rem}#tes-login p{margin:0;color:#5b6478;font-size:.9rem}
#tes-login label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:#5b6478}
#tes-login input,#tes-login select{font:inherit;border:1px solid #dfe3ef;border-radius:8px;padding:10px 12px;color:#141a2e;background:#fff}
#tes-login button{font:600 .95rem inherit;border:0;border-radius:8px;background:#1b2f8a;color:#fff;padding:11px;cursor:pointer}
#tes-login button.sec{background:none;color:#1b2f8a;padding:4px;text-decoration:underline}
#tes-login{overflow-y:auto}#tes-login form{margin:auto}
#tes-login .m{min-height:1.2em;color:#b0281f;font-size:.88rem}
@media (prefers-color-scheme:dark){#tes-login{background:#0f1220;color:#e6e9f5}#tes-login form{background:#181c2e;border-color:#2a3048}#tes-login input,#tes-login select{background:#181c2e;color:#e6e9f5;border-color:#2a3048}#tes-login p,#tes-login label{color:#9aa3bd}}
</style>
<script>
/* Capa de conexión con Supabase: implementa la interfaz claude.use que usa la app,
   con login por correo, varias empresas por persona y datos aislados por empresa (RLS). */
(function(){
"use strict";
const C=window.TES_SUPABASE||{};
/* Nombre comercial de la plataforma: se cambia en config.js (marca) */
const MARCA=String(C.marca||"Conciliación").replace(/[<>&"]/g,"");window.TES_MARCA=MARCA;document.title=MARCA;
const E=(code,message)=>({code,message:message||code});
const sb=(C.url&&C.anonKey&&window.supabase)?window.supabase.createClient(C.url,C.anonKey,{auth:{persistSession:true,storageKey:"tes-sb-auth",autoRefreshToken:true}}):null;
const TES={sb,empresa:null,empresas:[],esSuper:false,usuario:null,rol:null};window.TES=TES;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function caja(html){let d=document.getElementById("tes-login");if(!d){d=document.createElement("div");d.id="tes-login";document.body.append(d)}d.innerHTML=html;return d}
function pedirLogin(){
  return new Promise(ok=>{
    const d=caja(`<form id="tl-f"><h1>${MARCA}</h1><p>Entra con tu correo y contraseña.</p>
      <label>Correo<input id="tl-u" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="tl-p" type="password" autocomplete="current-password" required></label>
      <button id="tl-b" type="submit">Entrar</button><div class="m" id="tl-m" role="alert"></div>
      <button type="button" class="sec" id="tl-o">Olvidé mi contraseña</button></form>`);
    const m=d.querySelector("#tl-m");
    d.querySelector("#tl-o").onclick=async()=>{const u=d.querySelector("#tl-u").value.trim();if(!u){m.textContent="Escribe tu correo arriba y vuelve a presionar.";return}
      const r=await sb.auth.resetPasswordForEmail(u,{redirectTo:location.origin+location.pathname});m.style.color="";m.textContent=r.error?("No se pudo enviar: "+r.error.message):"Si el correo existe, te llegará un enlace para cambiar la contraseña. Si no llega, pídesela a tu administradora."};
    d.querySelector("#tl-f").onsubmit=async e=>{e.preventDefault();const b=d.querySelector("#tl-b");b.disabled=true;m.textContent="Verificando…";
      const r=await sb.auth.signInWithPassword({email:d.querySelector("#tl-u").value.trim(),password:d.querySelector("#tl-p").value});
      b.disabled=false;if(r.error){m.textContent=/invalid/i.test(r.error.message)?"Correo o contraseña incorrectos.":"No se pudo entrar: "+r.error.message;return}
      ok(r.data.session)};
  });
}
function pedirNuevaClave(){
  return new Promise(ok=>{
    const d=caja(`<form id="tl-f"><h1>Nueva contraseña</h1><p>Escribe tu nueva contraseña (mínimo 10 caracteres).</p>
      <label>Nueva contraseña<input id="tl-p" type="password" autocomplete="new-password" required></label>
      <label>Repítela<input id="tl-r" type="password" autocomplete="new-password" required></label>
      <button type="submit">Guardar</button><div class="m" id="tl-m"></div></form>`);
    d.querySelector("#tl-f").onsubmit=async e=>{e.preventDefault();const p=d.querySelector("#tl-p").value,m=d.querySelector("#tl-m");
      if(p.length<10){m.textContent="Mínimo 10 caracteres.";return}if(p!==d.querySelector("#tl-r").value){m.textContent="No coinciden.";return}
      const r=await sb.auth.updateUser({password:p});if(r.error){m.textContent=r.error.message;return}ok()};
  });
}
/* ---- Clave dinámica (segundo paso obligatorio): código de 6 dígitos de Google Authenticator o Microsoft Authenticator.
   La primera vez se configura escaneando un código QR; después se pide en cada inicio de sesión. ---- */
const salirBtn=`<button type="button" class="sec" onclick="TES_SALIR()">Salir</button>`;
function pedirCodigo(factorId){
  return new Promise(ok=>{
    const d=caja(`<form id="tl-f"><h1>Clave dinámica</h1><p>Abre tu aplicación de autenticación (Google Authenticator o Microsoft Authenticator) y escribe el código de 6 dígitos de «${MARCA}».</p>
      <label>Código<input id="tl-c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
      <button id="tl-b" type="submit">Entrar</button><div class="m" id="tl-m" role="alert"></div>${salirBtn}
      <p>¿Cambiaste o perdiste el celular? Pídele a tu administradora que restablezca tu clave dinámica.</p></form>`);
    const c=d.querySelector("#tl-c"),m=d.querySelector("#tl-m");setTimeout(()=>c.focus(),50);
    d.querySelector("#tl-f").onsubmit=async e=>{e.preventDefault();const b=d.querySelector("#tl-b");b.disabled=true;m.textContent="Verificando…";
      const r=await sb.auth.mfa.challengeAndVerify({factorId,code:c.value.replace(/\D/g,"")});b.disabled=false;
      if(r.error){m.textContent="Código incorrecto o vencido. Espera a que cambie y escríbelo de nuevo.";c.value="";c.focus();return}ok()};
  });
}
async function activarClave(todos){
  for(const f of todos.filter(x=>x.status!=="verified")){try{await sb.auth.mfa.unenroll({factorId:f.id})}catch(e){}}
  const en=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"Celular "+new Date().toISOString().slice(0,16)});
  if(en.error)throw new Error("no se pudo preparar la clave dinámica: "+en.error.message);
  return new Promise(ok=>{
    const d=caja(`<form id="tl-f"><h1>Configura tu clave dinámica</h1>
      <p>Es obligatoria y se hace una sola vez. Protege tu cuenta aunque alguien conozca tu contraseña.</p>
      <p><strong>1.</strong> Instala en tu celular <strong>Google Authenticator</strong> o <strong>Microsoft Authenticator</strong>.<br><strong>2.</strong> En esa aplicación elige «Agregar cuenta» o «Escanear código QR» y apunta a este código:</p>
      <img id="tl-qr" alt="Código QR para la aplicación de autenticación" style="width:190px;height:190px;align-self:center;background:#fff;border-radius:8px;padding:6px">
      <p>Si no puedes escanearlo, escribe esta clave en la aplicación:<br><code id="tl-s" style="word-break:break-all;font-size:.85rem"></code></p>
      <label><span><strong>3.</strong> Escribe el código de 6 dígitos que te muestra</span><input id="tl-c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
      <button id="tl-b" type="submit">Activar y entrar</button><div class="m" id="tl-m" role="alert"></div>${salirBtn}</form>`);
    d.querySelector("#tl-qr").src=en.data.totp.qr_code;d.querySelector("#tl-s").textContent=en.data.totp.secret;
    const c=d.querySelector("#tl-c"),m=d.querySelector("#tl-m");
    d.querySelector("#tl-f").onsubmit=async e=>{e.preventDefault();const b=d.querySelector("#tl-b");b.disabled=true;m.textContent="Verificando…";
      const r=await sb.auth.mfa.challengeAndVerify({factorId:en.data.id,code:c.value.replace(/\D/g,"")});b.disabled=false;
      if(r.error){m.textContent="Ese código no coincide. Revisa que escaneaste este QR y escribe el código nuevo.";c.value="";c.focus();return}ok()};
  });
}
async function claveDinamica(){
  const f=await sb.auth.mfa.listFactors();if(f.error)throw new Error(f.error.message);
  const ver=(f.data?.totp||[]).filter(x=>x.status==="verified");
  if(!ver.length)return activarClave(f.data?.all||[]);
  const a=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(a.data?.currentLevel==="aal2")return;
  return pedirCodigo(ver[0].id);
}
async function elegirEmpresa(lista){
  const guardada=ls.get("tes-empresa");const hit=lista.find(x=>x.empresa_id===guardada);if(hit||lista.length===1)return hit||lista[0];
  return new Promise(ok=>{
    const d=caja(`<form id="tl-f"><h1>¿En qué empresa vas a trabajar?</h1><label>Empresa<select id="tl-e"></select></label><button type="submit">Entrar</button></form>`);
    const s=d.querySelector("#tl-e");for(const x of lista){const o=document.createElement("option");o.value=x.empresa_id;o.textContent=x.empresas?.nombre||x.empresa_id;s.append(o)}
    d.querySelector("#tl-f").onsubmit=e=>{e.preventDefault();ok(lista.find(x=>x.empresa_id===s.value))};
  });
}
const listo=(async()=>{
  if(!sb){window.TES_LOGIN_ERROR="falta configurar config.js con la dirección y la clave pública de Supabase";return null}
  if(document.readyState==="loading")await new Promise(r=>document.addEventListener("DOMContentLoaded",r,{once:true}));
  if(/type=recovery/.test(location.hash)){await new Promise(r=>setTimeout(r,800));await pedirNuevaClave();history.replaceState(null,"",location.pathname)}
  let {data:{session}}=await sb.auth.getSession();
  if(!session)session=await pedirLogin();
  if(C.claveDinamica!==false){
    try{await claveDinamica()}catch(e){caja(`<form><h1>${MARCA}</h1><p>No se pudo verificar la clave dinámica (${String(e.message||e).replace(/[<>&]/g,"")}). Recarga la página e intenta de nuevo.</p>${salirBtn}</form>`);return null}
  }
  TES.usuario=session.user;
  caja(`<form><h1>${MARCA}</h1><p>Cargando tus empresas…</p></form>`);
  const [ms,sa]=await Promise.all([sb.from("miembros").select("empresa_id,rol,nombre,empresas(nombre,activa)").eq("user_id",session.user.id),sb.from("plataforma_admins").select("user_id").eq("user_id",session.user.id).maybeSingle()]);
  if(ms.error){window.TES_LOGIN_ERROR=ms.error.message;document.getElementById("tes-login")?.remove();return null}
  TES.esSuper=!!sa.data;
  const lista=(ms.data||[]).filter(x=>x.empresas&&x.empresas.activa!==false);TES.empresas=lista.map(x=>({id:x.empresa_id,nombre:x.empresas?.nombre||"",rol:x.rol}));
  if(lista.length){const e=await elegirEmpresa(lista);TES.empresa=e.empresa_id;TES.rol=e.rol;ls.set("tes-empresa",TES.empresa)}
  else if(!TES.esSuper){caja(`<form><h1>Sin empresa asignada</h1><p>Tu cuenta (${session.user.email}) todavía no pertenece a ninguna empresa. Pídele a tu administradora que te agregue.</p><button type="button" onclick="TES.sb.auth.signOut().then(()=>location.reload())">Salir</button></form>`);return null}
  document.getElementById("tes-login")?.remove();
  try{if(TES.empresa)await sb.rpc("marcar_ingreso",{e:TES.empresa})}catch(e){}
  return session;
})();
TES.cambiarEmpresa=id=>{ls.set("tes-empresa",id);location.reload()};
window.TES_SALIR=async()=>{try{await sb.auth.signOut()}catch(e){}location.reload()};

/* ---- datos: tabla docs filtrada por empresa ---- */
async function q(p){const r=await p;if(r.error)throw E(r.error.code==="42501"||/row-level|permission/i.test(r.error.message)?"invalid_argument":"unavailable",r.error.message);return r.data}
const partir=p=>{const i=p.lastIndexOf("/");return [p.slice(0,i),p.slice(i+1)]};
const snap=(id,data)=>({id,exists:data!=null,data:()=>data==null?undefined:data,metadata:{fromCache:false,hasPendingWrites:false}});
function mezclar(a,b){const o={...(a||{})};for(const [k,v] of Object.entries(b)){if(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))o[k]=mezclar(o[k],v);else o[k]=v}return o}
const uuid=()=>crypto.randomUUID?crypto.randomUUID():[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
const oyentes=new Set();let canal=null;
const avisar=col=>oyentes.forEach(f=>f(col));
function asegurarCanal(){if(canal||!TES.empresa)return;
  canal=sb.channel("tes-"+TES.empresa)
    .on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"empresa_id=eq."+TES.empresa},p=>{const r=(p.new&&p.new.coleccion)?p.new:p.old;avisar(r&&r.coleccion)})
    .on("postgres_changes",{event:"*",schema:"public",table:"miembros",filter:"empresa_id=eq."+TES.empresa},()=>{avisar("people");avisar("config")})
    .subscribe()}
function suscribir(col,correr){
  let vivo=true,t=null,ocupado=false;
  const ir=async()=>{if(!vivo||ocupado)return;ocupado=true;try{await correr()}finally{ocupado=false}};
  const empujar=()=>{clearTimeout(t);t=setTimeout(ir,250)};
  const f=c=>{if(!c||c===col)empujar()};asegurarCanal();oyentes.add(f);
  const iv=setInterval(()=>{if(document.visibilityState==="visible")ir()},60000);
  const vis=()=>{if(document.visibilityState==="visible")empujar()};document.addEventListener("visibilitychange",vis);
  ir();return ()=>{vivo=false;clearTimeout(t);clearInterval(iv);oyentes.delete(f);document.removeEventListener("visibilitychange",vis)};
}
/* roles y personas viven en la tabla miembros */
const ROL_APP=r=>r==="sin_acceso"?"":r, ROL_DB=r=>r?r:"sin_acceso";
async function miembros(){if(!TES.empresa)return [];return await q(sb.from("miembros").select("user_id,rol,nombre,correo,primera_vez,ultima_vez").eq("empresa_id",TES.empresa))}
async function leerEspecial(col,id){
  if(col==="config"&&id==="roles"){const ms=await miembros();return {usuarios:Object.fromEntries(ms.map(m=>[m.user_id,{rol:ROL_APP(m.rol),nombre:m.nombre||""}]))}}
  if(col==="people"){const ms=await miembros();const m=ms.find(x=>x.user_id===id);return m?{primeraVez:m.primera_vez||"",ultimaVez:m.ultima_vez||"",nombreDeclarado:m.nombre||"",correo:m.correo||""}:null}
  return undefined;
}
async function escribirEspecial(col,id,data){
  if(col==="config"&&id==="roles"){const ms=await miembros();
    for(const [uid,v] of Object.entries(data.usuarios||{})){const m=ms.find(x=>x.user_id===uid);if(!m)continue;
      if(ROL_DB(v.rol)!==m.rol||(v.nombre||"")!==(m.nombre||""))await q(sb.from("miembros").update({rol:ROL_DB(v.rol),nombre:v.nombre||null}).eq("empresa_id",TES.empresa).eq("user_id",uid))}
    avisar("config");avisar("people");return true}
  if(col==="people"){if(id===TES.usuario.id){try{await sb.rpc("marcar_ingreso",{e:TES.empresa})}catch(e){}}
    else if(data&&data.nombreDeclarado!=null){try{await q(sb.from("miembros").update({nombre:data.nombreDeclarado}).eq("empresa_id",TES.empresa).eq("user_id",id))}catch(e){}}
    avisar("people");return true}
  return false;
}
function docRef(path){
  const [col,id]=partir(path);
  const ref={id,path,
    async get(){const esp=await leerEspecial(col,id);if(esp!==undefined)return snap(id,esp);
      if(!TES.empresa)return snap(id,null);
      const d=await q(sb.from("docs").select("data").eq("empresa_id",TES.empresa).eq("coleccion",col).eq("id",id).maybeSingle());return snap(id,d?d.data:null)},
    async set(data){if(!TES.empresa||await escribirEspecial(col,id,data))return;await q(sb.from("docs").upsert({empresa_id:TES.empresa,coleccion:col,id,data}));avisar(col)},
    async update(data){if(!TES.empresa||await escribirEspecial(col,id,data))return;
      const d=await q(sb.from("docs").select("data").eq("empresa_id",TES.empresa).eq("coleccion",col).eq("id",id).maybeSingle());if(!d)throw E("invalid_argument","El documento no existe");
      await q(sb.from("docs").update({data:mezclar(d.data,data)}).eq("empresa_id",TES.empresa).eq("coleccion",col).eq("id",id));avisar(col)},
    async delete(){await q(sb.from("docs").delete().eq("empresa_id",TES.empresa).eq("coleccion",col).eq("id",id));avisar(col)},
    async acquire(){return {acquired:true}},
    onSnapshot(next,error){let firma=null,fallo=false;return suscribir(col,async()=>{try{const s=await ref.get();const f=JSON.stringify(s.data()??null);if(f!==firma){firma=f;next(s)}}catch(e){if(!fallo&&error){fallo=true;error(e)}}})},
    collection(sub){return colRef(path+"/"+sub)}};
  return ref;
}
function consulta(col,filtros,orden,lim){
  const correr=async()=>{
    if(col==="people"){const ms=await miembros();const docs=ms.map(m=>snap(m.user_id,{primeraVez:m.primera_vez||"",ultimaVez:m.ultima_vez||"",nombreDeclarado:m.nombre||"",correo:m.correo||""}));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}}
    if(!TES.empresa)return {docs:[],size:0,empty:true,docChanges:()=>[],metadata:{}};
    const armar=()=>{let b=sb.from("docs").select("id,data").eq("empresa_id",TES.empresa).eq("coleccion",col);
      for(const [f,op,v] of filtros){if(f==="mes"&&op==="in")b=b.in("mes",v);else if(f==="mes"&&op==="==")b=b.eq("mes",v);else{const k="data->>"+f;if(op==="==")b=b.eq(k,String(v));else if(op==="in")b=b.in(k,v.map(String))}}
      return orden?b.order("data->>"+orden[0],{ascending:orden[1]!=="desc"}):b.order("id")};
    /* Supabase entrega máximo 1000 filas por consulta: se piden por páginas */
    const filas=[];const tope=lim||100000;
    for(let i=0;i<tope;i+=1000){const p=await q(armar().range(i,Math.min(i+999,tope-1)));filas.push(...p);if(p.length<1000)break}
    const docs=filas.map(r=>snap(r.id,r.data));
    return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};
  };
  const api={where(f,op,v){return consulta(col,[...filtros,[f,op,v]],orden,lim)},orderBy(f,dir){return consulta(col,filtros,[f,dir||"asc"],lim)},limit(n){return consulta(col,filtros,orden,n)},
    get:correr,
    onSnapshot(next,error){let firma=null,fallo=false;return suscribir(col,async()=>{try{const r=await correr();const f=JSON.stringify(r.docs.map(d=>[d.id,d.data()]));if(f!==firma){firma=f;next(r)}}catch(e){if(!fallo&&error){fallo=true;error(e)}}})}};
  return api;
}
function colRef(col){const c=consulta(col,[],null,0);c.path=col;c.doc=id=>docRef(col+"/"+(id||uuid().replace(/-/g,"").slice(0,20)));c.add=async data=>{const r=c.doc();await r.set(data);return r};return c}
const db={doc:docRef,collection:colRef};

/* ---- usuarios ---- */
const COLORES=["#1b2f8a","#285a98","#9a5a06","#7a3e9d","#b0281f","#2f6f73"];
const colorDe=id=>{let n=0;for(const ch of String(id))n=(n*31+ch.charCodeAt(0))|0;return COLORES[Math.abs(n)%COLORES.length]};
const avatar=(txt,color)=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" rx="20" fill="${color}"/><text x="20" y="26" font-size="18" text-anchor="middle" fill="#fff" font-family="sans-serif">${String(txt||"?").trim().charAt(0).toUpperCase().replace(/[<>&"]/g,"")}</text></svg>`);
const user={
  async id(){return TES.usuario?.id||null},async isOwner(){return TES.rol==="admin"},async canEdit(){return false},async can(){return null},
  async me(){const id=TES.usuario.id,email=TES.usuario.email,color=colorDe(id);return {id,name:email.split("@")[0],avatarUrl:avatar(email,color),color,email,isOwner:TES.rol==="admin",canEdit:false}},
  async profiles(ids){ids=[].concat(ids);let ms=[];try{ms=await miembros()}catch(e){}const out={};
    for(const id of ids){const m=ms.find(x=>x.user_id===id);const name=m?(m.nombre||String(m.correo||"").split("@")[0]):"";const color=colorDe(id);out[id]={id,name,avatarUrl:avatar(name||"?",color),color,email:m?.correo||null,isMe:id===TES.usuario?.id,guest:false}}
    return out},
  async name(){return TES.usuario?.email.split("@")[0]||""},async avatarUrl(){return null},async search(){return []},async email(){return TES.usuario?.email||null}
};

/* ---- soportes: carpeta privada de la empresa; las fotos se comprimen para ahorrar espacio ---- */
const EXT={"image/png":"png","image/jpeg":"jpg","image/webp":"webp","application/pdf":"pdf"};
function comprimir(blob){return new Promise(ok=>{if(!/^image\//.test(blob.type)||blob.size<500*1024)return ok(blob);
  const u=URL.createObjectURL(blob);const im=new Image();im.onload=()=>{const s=Math.min(1,1800/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok(b&&b.size<blob.size?b:blob),"image/jpeg",0.85)};im.onerror=()=>ok(blob);im.src=u})}
const urls=new Map();
async function urlSoporte(id){if(urls.has(id))return urls.get(id);const r=await sb.storage.from("soportes").createSignedUrl(id,3600);const u=r.data?.signedUrl||"";if(u)urls.set(id,u);return u}
window.TES_URL_SOPORTE=id=>urlSoporte(id).catch(()=>"");
const assets={
  async upload(blob,opt){let type=(opt&&opt.type)||blob.type;if(!EXT[type])throw E("unsupported_type","Tipo de archivo no permitido");
    const b=await comprimir(blob);if(b!==blob)type="image/jpeg";if(b.size>10*1024*1024)throw E("too_large","Máximo 10 MB");
    const id=`${TES.empresa}/${uuid()}.${EXT[type]}`;const r=await sb.storage.from("soportes").upload(id,b,{contentType:type,upsert:false});if(r.error)throw E("upstream_error",r.error.message);
    return {id,url:await urlSoporte(id),sizeBytes:b.size,contentType:type}},
  async list(){return {assets:[],usage:{files:0,bytes:0,maxFiles:0,maxBytes:0}}},async delete(){return {deleted:false}}
};
const downloads={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data],{type:"text/csv;charset=utf-8"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return {saved:true}}};

/* ---- funciones de administración (servidor) ---- */
async function fn(body){const {data,error}=await sb.functions.invoke("gestion-usuarios",{body});
  if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}throw E("unavailable",m)}
  if(data&&data.error)throw E("unavailable",data.error);return data}
window.TES_ADMIN={
  disponible:()=>!!TES.empresa,
  crearUsuario:async(d)=>{const r=await fn({accion:"crear_usuario",empresa_id:TES.empresa,...d});avisar("people");avisar("config");return r},
  cambiarClave:(user_id,clave)=>fn({accion:"cambiar_clave",empresa_id:TES.empresa,user_id,clave}),
  quitarClaveDinamica:(user_id)=>fn({accion:"quitar_clave_dinamica",empresa_id:TES.empresa,user_id}),
  async quitar(user_id){await q(sb.from("miembros").delete().eq("empresa_id",TES.empresa).eq("user_id",user_id));avisar("people");avisar("config")},
  crearEmpresa:(d)=>fn({accion:"crear_empresa",...d}),
  async empresas(){return await q(sb.from("empresas").select("id,nombre,nit,activa,creada_en").order("creada_en"))},
  async activarEmpresa(id,activa){await q(sb.from("empresas").update({activa}).eq("id",id))},
  async agregarmeAdmin(id){await q(sb.from("miembros").upsert({empresa_id:id,user_id:TES.usuario.id,rol:"admin",correo:TES.usuario.email}))},
  async importar(texto,prog){
    const d=JSON.parse(String(texto).replace(/^﻿/,""));if(d.formato!=="control-tesoreria-export")throw E("invalid_argument","Ese archivo no es una exportación de Control de Tesorería.");
    const nombres={};for(const [uid,p] of Object.entries(d.personas||{}))nombres[uid]=(d.roles?.[uid]?.nombre)||p.nombreDeclarado||p.correo||"usuario";
    for(const [uid,r] of Object.entries(d.roles||{}))if(!nombres[uid])nombres[uid]=r.nombre||"usuario";
    const autor=u=>u&&nombres[u]?"imp:"+nombres[u]:(u?"imp:usuario anterior":u);
    const ids=Object.keys(d.soportes||{});const nuevoId={};let k=0;
    for(const id of ids){prog(`Subiendo soportes (${++k}/${ids.length})…`);const ext=String(id).split(".").pop();const type=Object.keys(EXT).find(t=>EXT[t]===ext)||"application/pdf";
      const bytes=Uint8Array.from(atob(d.soportes[id]),c=>c.charCodeAt(0));const nid=`${TES.empresa}/${uuid()}.${EXT[type]||ext}`;
      const r=await sb.storage.from("soportes").upload(nid,new Blob([bytes],{type}),{contentType:type,upsert:false});if(r.error)throw E("upstream_error","Soporte "+id+": "+r.error.message);nuevoId[id]=nid}
    const filas=[];
    for(const col of ["pagos","ingresos","banco"])for(const [id,x] of Object.entries(d.docs?.[col]||{})){const v=JSON.parse(JSON.stringify(x));
      if(v.soporteId)v.soporteId=nuevoId[v.soporteId]||null;["createdBy","updatedBy","creadoPor"].forEach(f=>{if(v[f])v[f]=autor(v[f])});
      if(Array.isArray(v.historial))v.historial=v.historial.map(hh=>({...hh,by:autor(hh.by)}));v.importado=true;filas.push({empresa_id:TES.empresa,coleccion:col,id,data:v})}
    for(let i=0;i<filas.length;i+=200){prog(`Guardando registros (${Math.min(i+200,filas.length)}/${filas.length})…`);await q(sb.from("docs").upsert(filas.slice(i,i+200)))}
    avisar("pagos");avisar("ingresos");avisar("banco");return {registros:filas.length,soportes:ids.length};
  }
};
window.TES_MICLAVE={disponible:()=>!!TES.usuario,
  async cambiar(actual,nueva){
    /* la contraseña actual se comprueba con una conexión aparte, para no perder la sesión ya verificada con clave dinámica */
    const tmp=window.supabase.createClient(C.url,C.anonKey,{auth:{persistSession:false,autoRefreshToken:false,storageKey:"tes-sb-tmp"}});
    const r=await tmp.auth.signInWithPassword({email:TES.usuario.email,password:actual});if(r.error)throw E("invalid_argument","La contraseña actual no es correcta.");
    try{await tmp.auth.signOut({scope:"local"})}catch(e){}
    const u=await sb.auth.updateUser({password:nueva});if(u.error)throw E("unavailable",u.error.message)}};
window.claude={use:async name=>{const s=await listo;if(!s)return null;return ({db,user,assets,downloads})[name]||null}};
})();
</script>

"use strict";

function parseFecha(v){
  let y,m,d,x;
  if(v instanceof Date&&!isNaN(v))return fechaLocal(v);
  if(typeof v==="number"&&v>20000&&v<80000){const t=new Date(Math.round((v-25569)*86400000));return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`}
  const s=String(v??"").trim();
  if((x=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))[y,m,d]=[+x[1],+x[2],+x[3]];
  else if((x=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)))[d,m,y]=[+x[1],+x[2],+x[3]];
  else if((x=s.match(/^(\d{4})(\d{2})(\d{2})$/)))[y,m,d]=[+x[1],+x[2],+x[3]];
  else{const MES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12,jan:1,apr:4,aug:8,dec:12};
    if((x=norm(s).match(/^(\d{1,2})[\s\-\/.de]*([a-z]{3})[a-z]*[\s\-\/.,de]*(\d{2,4})/))&&MES[x[2]])[d,m,y]=[+x[1],MES[x[2]],+x[3]];}
  if(!y)return null; if(y<100)y+=2000;
  if(m<1||m>12||d<1||d>31)return null;
  return `${y}-${pad(m)}-${pad(d)}`;
}
function parseMonto(v){
  if(typeof v==="number")return isFinite(v)?v:null;
  let s=String(v??"").trim(); if(!s)return null;
  const neg=/^\(.*\)$/.test(s)||s.includes("-");
  s=s.replace(/[^\d.,]/g,""); if(!/\d/.test(s))return null;
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>-1&&ld>-1){const dec=lc>ld?",":".";const th=dec===","?".":",";s=s.split(th).join("").replace(dec,".")}
  else if(lc>-1){s=(/,\d{1,2}$/.test(s)&&s.split(",").length===2)?s.replace(",","."):s.replace(/,/g,"")}
  else if(ld>-1){s=(/\.\d{1,2}$/.test(s)&&s.split(".").length===2)?s:s.replace(/\./g,"")}
  const n=parseFloat(s); if(!isFinite(n))return null; return neg?-n:n;
}

function conciliar(){
  const byMov=new Map(),recMov=new Map(),movById=new Map(S.movs.map(m=>[m.id,m]));
  const link=(m,tipo,r,auto)=>{byMov.set(m.id,{tipo,rec:r,auto});recMov.set(r.id,m.id)};
  const recs=[...S.pagos.map(r=>["pago",r]),...S.ingresos.map(r=>["ingreso",r])].filter(([,r])=>!r.anulado);
  for(const [t,r] of recs){if(r.movId){const m=movById.get(r.movId);if(m&&!byMov.has(m.id)&&((t==="pago")===(m.valor<0)))link(m,t,r,false)}}
  const orden=[...S.movs].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  for(const m of orden){
    if(byMov.has(m.id))continue; const t=m.valor<0?"pago":"ingreso"; const pool=t==="pago"?S.pagos:S.ingresos; let best=null,bd=99;
    for(const r of pool){
      if(r.anulado||recMov.has(r.id))continue; if(r.movId)continue;
      if((r.rechazados||[]).includes(m.id))continue;
      if(cents(r.valor)!==cents(m.valor))continue;
      const d=Math.abs(diasEntre(m.fecha,r.fecha)); if(d<=6&&d<bd){bd=d;best=r}
    }
    if(best)link(m,t,best,true);
  }
  S.conc={byMov,recMov};
}

  const page=await pdf.getPage(1); const vp0=page.getViewport({scale:1}); const scale=Math.min(2.2,1600/Math.max(vp0.width,vp0.height));

async function textoPDF(file){
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  await cargarScript(base+"pdf.worker.min.js");await cargarScript(base+"pdf.min.js");
  const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let t="";
  for(let n=1;n<=Math.min(pdf.numPages,2);n++){const pg=await pdf.getPage(n);const c=await pg.getTextContent();const filas={};
    for(const it of c.items){if(!it.str)continue;const y=Math.round(it.transform[5]/3);(filas[y]??=[]).push(it)}
    t+=Object.keys(filas).sort((a,b)=>b-a).map(y=>filas[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(" ")).join("\n")+"\n"}
  return t;
}
const MESES_ES={ene:1,enero:1,feb:2,febrero:2,mar:3,marzo:3,abr:4,abril:4,may:5,mayo:5,jun:6,junio:6,jul:7,julio:7,ago:8,agosto:8,sep:9,sept:9,set:9,septiembre:9,setiembre:9,oct:10,octubre:10,nov:11,noviembre:11,dic:12,diciembre:12};
function analizarComprobante(texto){
  const L=String(texto||"").split(/\r?\n/).map(s=>s.replace(/[|_]/g," ").replace(/\s+/g," ").trim()).filter(Boolean);
  const out={tercero:null,nit:null,valor:null,fecha:null,referencia:null};
  /* valor */
  const reM=/(\$|cop)?\s*(\d{1,3}(?:[.,']\d{3})+(?:[.,]\d{1,2})?|\d{3,}(?:[.,]\d{1,2})?)/gi;
  const montos=l=>{const r=[];let m;reM.lastIndex=0;while((m=reM.exec(l||""))){const signo=!!m[1];if(!signo&&/^(19|20)\d{2}$/.test(m[2]))continue;const v=parseMonto(m[2].replace(/'/g,"."));if(v&&Math.abs(v)>=100&&Math.abs(v)<1e11)r.push({v:Math.abs(v),signo})}return r};
  const kwV=/(valor|monto|total|importe|pagaste|enviaste|transferiste|pagado|pago por|cantidad|cu[aá]nto)/i,kwNo=/(saldo|costo|comisi|iva|cuota de manejo|disponible|cuenta|n[uú]mero|celular|nit|c[eé]dula|referencia|aprobaci|tel[eé]fono|documento)/i;
  const cand=[];
  L.forEach((l,i)=>{if(kwV.test(l)&&!kwNo.test(l)){let ms=montos(l);if(!ms.length)ms=montos(L[i+1]);ms.forEach(m=>cand.push({...m,p:m.signo?4:3}))}});
  if(!cand.length)L.forEach(l=>{if(!kwNo.test(l))montos(l).filter(m=>m.signo).forEach(m=>cand.push({...m,p:2}))});
  if(cand.length){cand.sort((a,b)=>b.p-a.p||b.v-a.v);out.valor=cand[0].v}
  /* fecha */
  const F=[];const ok=f=>f&&f>="2015-01-01"&&f<="2099-12-31";
  L.forEach(l=>{const p=/fecha|realiz|transacci|hora/i.test(l)?2:1;let m;
    const r1=/\b(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}|\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2})\b/g;while((m=r1.exec(l))){const f=parseFecha(m[1]);if(ok(f))F.push({f,p})}
    const r2=/\b(\d{1,2})\s*(?:de\s+)?([a-záéíóú]{3,10})\.?\s*(?:de\s+|del\s+)?(\d{4})\b/gi;while((m=r2.exec(l))){const mo=MESES_ES[norm(m[2])];const f=mo&&+m[1]>=1&&+m[1]<=31?`${m[3]}-${pad(mo)}-${pad(m[1])}`:null;if(ok(f))F.push({f,p})}
    const r3=/\b([a-záéíóú]{3,10})\.?\s+(\d{1,2}),?\s+(?:de\s+)?(\d{4})\b/gi;while((m=r3.exec(l))){const mo=MESES_ES[norm(m[1])];const f=mo&&+m[2]>=1&&+m[2]<=31?`${m[3]}-${pad(mo)}-${pad(m[2])}`:null;if(ok(f))F.push({f,p})}});
  if(F.length){F.sort((a,b)=>b.p-a.p);out.fecha=F[0].f}
  /* tercero */
  const kwT=/^(?:nombre\s+(?:del?\s+)?)?(destinatario|beneficiario|titular(?:\s+de\s+la\s+cuenta)?|pagado\s+a|enviado\s+a|enviaste\s+a|le\s+pagaste\s+a|transferiste\s+a|para|empresa|convenio|comercio|raz[oó]n\s+social|proveedor|a\s+nombre\s+de|nombre)\b\s*[:\-]?\s*(.*)$/i;
  const valido=s=>s&&s.length>=3&&/[a-záéíóúñ]{3}/i.test(s)&&!/\d{5,}/.test(s)&&!/^(ahorros|corriente|cuenta|producto|nequi$|daviplata$|bancolombia$|davivienda$|bbva$|banco\b|transferencia|pse\b|exitosa|aprobad|comprobante|valor|fecha|\$)/i.test(s);
  for(let i=0;i<L.length&&!out.tercero;i++){const m=L[i].match(kwT);if(m){let v=(m[2]||"").trim();if(!valido(v))v=(L[i+1]||"").trim();if(valido(v))out.tercero=v.replace(/[*•]+/g,"").trim().slice(0,80)}}
  /* nit y referencia */
  const tx=L.join("\n");
  const mn=tx.match(/\b(?:nit|c\.?\s?c\.?|c[eé]dula|documento|identificaci[oó]n)\b\s*(?:no\.?|n[uú]mero|#)?\s*[:.]?\s*(\d[\d.\-\s]{5,16}\d)/i);if(mn)out.nit=mn[1].replace(/\s/g,"");
  const mr=tx.match(/\b(?:referencia|comprobante|n[uú]mero\s+de\s+(?:aprobaci[oó]n|transacci[oó]n|comprobante)|aprobaci[oó]n|cus)\b\s*(?:no\.?|#)?\s*[:.]?\s*([A-Z0-9\-]{4,})/i);if(mr)out.referencia=mr[1];
  return out;
}
async function leerComprobante(file,onEstado){
  const tarea=tessCola.catch(()=>{}).then(async()=>{
    let texto="";
    if(tipoArchivo(file)==="application/pdf"){onEstado("Leyendo el PDF…");texto=await textoPDF(file);if(texto.replace(/\s/g,"").length<30)texto=await ocrImagen(await pdfAImagen(file),onEstado)}
    else texto=await ocrImagen(file,onEstado);
    return {...analizarComprobante(texto),texto};
  });
  tessCola=tarea;
  try{return await tarea}catch(e){console.warn("lectura",e);return {error:"No se pudo leer el comprobante automáticamente. Escribe los datos a mano."}}
}

function sugerenciaConcepto(tercero){

  const igual=a=>a===t||(Math.min(a.length,t.length)>=6&&(a.startsWith(t)||t.startsWith(a)));

/* ---------- acciones comunes ---------- */
async function crearRegistro(tipo,data){
  /* el concepto se guarda escrito igual que en la lista, para que los informes lo agrupen bien */
  if(tipo==="pago"&&data.concepto)data={...data,concepto:enLista(data.concepto,conceptosPago())||data.concepto};
  if(tipo==="ingreso"&&data.descripcion)data={...data,descripcion:enLista(data.descripcion,cat().ingresos)||data.descripcion};
  const at=nowISO();
  const doc={...data,mes:data.fecha.slice(0,7),anulado:false,createdBy:S.uid,createdAt:at,updatedBy:S.uid,updatedAt:at,historial:[{at,by:S.uid,accion:"Creado"}]};
  const ref=await S.db.collection(tipo==="pago"?"pagos":"ingresos").add(doc);
  registrarActividad(tipo==="pago"?"Registró pago":"Registró ingreso",`${data.tercero} · ${fmt(data.valor)} · ${data.concepto||data.descripcion}`,{ref:ref.id});
  return ref;
}
async function vincular(tipo,r,movId){
  const hist=[...(r.historial||[]),{at:nowISO(),by:S.uid,accion:movId?"Vinculado manualmente a movimiento de banco":"Desvinculado del banco"}];
  await S.db.doc(`${tipo==="pago"?"pagos":"ingresos"}/${r.id}`).update({movId:movId||null,updatedBy:S.uid,updatedAt:nowISO(),historial:hist});
  registrarActividad(movId?"Vinculó con banco":"Desvinculó del banco",`${r.tercero} · ${fmt(r.valor)}`,{ref:r.id});
}
async function rechazarMatch(tipo,r,movId){
  const hist=[...(r.historial||[]),{at:nowISO(),by:S.uid,accion:"Marcado como no correspondiente al movimiento de banco"}];
  await S.db.doc(`${tipo==="pago"?"pagos":"ingresos"}/${r.id}`).update({movId:null,rechazados:uniq([...(r.rechazados||[]),movId]),updatedBy:S.uid,updatedAt:nowISO(),historial:hist});
